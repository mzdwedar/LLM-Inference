profile:
  kind: poisson
  rate: 8.0

# Define your data
data:
  kind: custom
  path: ./rag_workload.jsonl

output:
  kind: json
  path: ./vllm-rag-fp16-metrics.json

# Establish your SLO constraints (Goodput boundaries)
